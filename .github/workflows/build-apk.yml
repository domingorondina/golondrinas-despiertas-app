name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Dist
        run: node build.js

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android Platform with Capacitor
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Inject Exact Alarm and WakeLock Permissions
        run: |
          sed -i '/<application/i \    <uses-permission android:name=\ android.permission.SCHEDULE_EXACT_ALARM\ />\n    <uses-permission android:name=\android.permission.USE_EXACT_ALARM\ />\n    <uses-permission android:name=\android.permission.WAKE_LOCK\ />\n    <uses-permission android:name=\android.permission.VIBRATE\ />\n    <uses-permission android:name=\android.permission.POST_NOTIFICATIONS\ />\n    <uses-permission android:name=\android.permission.USE_FULL_SCREEN_INTENT\ />\n    <uses-permission android:name=\android.permission.FOREGROUND_SERVICE\ />\n    <uses-permission android:name=\android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\ />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:showWhenLocked=\true\ android:turnScreenOn=\true\ android:keepScreenOn=\true\/g' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Golondrinas-Despiertas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
